name: Continuous Testing

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-publish-report:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Cucumber Tests
        run: npm test
        continue-on-error: true

      - name: Prepare Report Site
        if: always()
        run: |
          mkdir -p report-site

          if [ -f reports/cucumber-report.html ]; then
            cp reports/cucumber-report.html report-site/index.html
          else
            cat > report-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>Test Report</title></head>
          <body>
            <h1>Test Report Not Generated</h1>
            <p>The test run completed but no report file was produced.</p>
          </body>
          </html>
          EOF
          fi

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: report-site

      - name: Deploy Report to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
