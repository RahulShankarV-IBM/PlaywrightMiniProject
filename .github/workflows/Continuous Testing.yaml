name: PropFind Continuous Testing

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Create Report Directories
        run: |
          mkdir -p reports
          mkdir -p gh-pages

      # Run tests but NEVER fail the workflow
      - name: Execute Cucumber Tests
        run: npm test
        continue-on-error: true

      # Ensure report folder always exists
      - name: Prepare GitHub Pages Content
        if: always()
        run: |
          mkdir -p gh-pages

          if [ -f reports/cucumber-report.html ]; then
            cp reports/cucumber-report.html gh-pages/index.html
          else
            cat <<EOF > gh-pages/index.html
            <!DOCTYPE html>
            <html>
            <head>
              <title>Test Report</title>
            </head>
            <body>
              <h1>Test Report Not Generated</h1>
              <p>The test execution completed but no report file was found.</p>
            </body>
            </html>
            EOF
          fi

          # Copy supporting assets if they exist
          cp -r reports/* gh-pages/ 2>/dev/null || true

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          retention-days: 30

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4